<!-- Localization completed -->
<div class='modal-body confirm confirm-dialog'>
    <button type="button" class="confirm-dialog-close" ng-click='cancel()' aria-label="Close">&times;</button>

    <div class="confirm-dialog-icon">
        <span class="glyphicon glyphicon-warning-sign"></span>
    </div>

    <div class="confirm-dialog-message">
        <span>{{message}}</span>
    </div>

    <div class="confirm-dialog-actions">
        <button class='btn btn-default confirm-dialog-cancel' ng-click='cancel()' localized>button.cancel</button>
        <button class='btn btn-default confirm-dialog-ok' ng-click='OK()'>{{okButtonTextKey | localize}}</button>
    </div>
</div>
