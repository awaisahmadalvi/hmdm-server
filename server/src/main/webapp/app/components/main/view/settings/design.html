<!-- Localization completed -->
<div class="width-1200 modern-page design-page" ng-controller="SettingsTabController">

    <div class="logs-page-header">
        <div>
            <h4 localized>form.settings.design.title</h4>
            <div class="logs-page-subtitle" localized>form.settings.design.subtitle</div>
        </div>
        <div class="logs-page-header-actions design-header-actions">
            <span class="design-unsaved-indicator" ng-if="isDesignDirty()" localized>form.settings.design.unsaved</span>
            <button type="button" class="logs-btn-reset" ng-disabled="!isDesignDirty()"
                    ng-click="resetDesignSettings()" localized>form.settings.design.reset</button>
            <button type="button" class="btn btn-modern-primary" ng-disabled="savingDesign"
                    ng-click="saveDefaultDesignSettings()">
                <span ng-if="!savingDesign" localized>form.settings.design.save</span>
                <span ng-if="savingDesign" localized>form.settings.design.saving</span>
            </button>
        </div>
    </div>

    <div ng-show='successMessage' class='device-details-inline-success'><span>{{successMessage}}</span></div>
    <div ng-show='errorMessage' class='device-details-inline-error'><span>{{errorMessage}}</span></div>

    <div class="design-body">
        <div class="design-form-col" ng-include="'app/components/main/view/shared/designFormFields.html'"></div>

        <div class="design-preview-col" ng-include="'app/components/main/view/shared/designPreview.html'"></div>
    </div>

    <div class="modern-toast" ng-if="designToast" ng-class="'modern-toast-' + designToast.type">
        {{designToast.message}}
    </div>
</div>
