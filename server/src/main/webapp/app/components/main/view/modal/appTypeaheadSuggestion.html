<!-- Per-suggestion row for the "Add application" dialog's typeahead (see
     addConfigurationApplication.html's typeahead-template-url) - shows an
     icon placeholder, name, package and version instead of ui-bootstrap's
     plain text-only default suggestion template. Selection logic (typeahead-
     on-select="onMainAppSelected($item)") is untouched. -->
<a>
    <div class="app-name-cell">
        <span class="app-icon-placeholder glyphicon glyphicon-apps"></span>
        <div>
            <div class="app-name-text" ng-bind-html="match.label | typeaheadHighlight:query"></div>
            <div class="device-details-app-pkg" ng-if="match.model.pkg">
                {{match.model.pkg}}<span ng-if="match.model.version"> &middot; {{match.model.version}}</span>
            </div>
        </div>
    </div>
</a>
