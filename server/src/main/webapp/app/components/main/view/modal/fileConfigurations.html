<!-- Localization completed -->
<div class="modern-modal-header">
    <div class="modern-modal-icon">
        <span class="glyphicon glyphicon-list"></span>
    </div>
    <h4 class="modern-modal-title" localized>form.files.action.configurations</h4>
    <button type="button" class="modern-modal-close" ng-click="closeModal()" aria-label="Close">&times;</button>
</div>

<div class="modal-body modern-modal-body">
    <div ng-show='errorMessage' class="device-details-inline-error"><span>{{errorMessage}}</span></div>

    <p class="field-hint">
        <strong>{{'form.file.configurations.file' | localize}}:</strong> {{file.fileName}}
    </p>
    <p class="field-hint" localized>form.file.configurations.description</p>

    <div class="modern-table-wrap" ng-if="configurations.length > 0">
        <table class="table modern-responsive-table">
            <thead>
            <tr>
                <th localized>form.file.configurations.configs</th>
                <th localized>form.file.configurations.upload</th>
            </tr>
            </thead>
            <tbody>
            <tr ng-repeat="configuration in configurations | orderBy: 'configurationName'">
                <td data-label="{{'form.file.configurations.configs' | localize}}">{{configuration.configurationName}}</td>
                <td data-label="{{'form.file.configurations.upload' | localize}}">
                    <span class="modern-toggle">
                        <input type="checkbox" class="modern-toggle-input" ng-model="configuration.upload"
                               ng-change="selectionChanged(configuration)">
                        <span class="modern-toggle-track"><span class="modern-toggle-knob"></span></span>
                    </span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="modern-modal-actions">
        <button type="button" class="btn btn-default" ng-click="closeModal()" localized>button.cancel</button>
        <button type="submit" class="btn btn-modern-primary" ng-click="save()" localized>button.save</button>
    </div>
</div>
