<!-- Localization completed -->
<div class="modern-modal-header">
    <div class="modern-modal-icon">
        <span class="glyphicon glyphicon-option-horizontal"></span>
    </div>
    <h4 class="modern-modal-title">{{application.name}}</h4>
    <button type="button" class="modern-modal-close" ng-click="closeModal()" aria-label="Close">&times;</button>
</div>

<div ng-show='errorMessage' class='modal-header'>
    <div ng-show='errorMessage' class='error'><span>{{errorMessage}}</span></div>
</div>
<div class='modal-body modern-modal-body'>
    <form class='form-horizontal'>

        <div class="form-group">
            <div class="col-sm-6">
                <label for="c_keyCode" localized>form.configuration.apps.keycode</label>
            </div>
            <div class="col-sm-6">
                <input type="text" id="c_keyCode" class="form-control" ng-model="application.keyCode"
                           value="{{application.keyCode}}"/>
            </div>
        </div>

        <div class="form-group">
            <div class="col-sm-6">
                <label for="c_bottom" localized>form.configuration.apps.bottom</label>
            </div>
            <div class="col-sm-6">
                <input type="checkbox" id="c_bottom" class="form-control" ng-model="application.bottom"
                       value="{{application.bottom}}"/>
            </div>
        </div>

        <div class="form-group">
            <div class="col-sm-6">
                <label for="c_bottom" localized>form.configuration.apps.long.tap</label>
            </div>
            <div class="col-sm-6">
                <input type="checkbox" id="c_longtap" class="form-control" ng-model="application.longTap"
                       value="{{application.longTap}}"/>
            </div>
        </div>

        <div class='form-group modern-modal-actions'>
            <div class='col-sm-12 text-center'>
                <button type='submit' class='btn btn-default btn-modern-primary' ng-click='closeModal()' localized>button.close</button>
            </div>
        </div>
    </form>
</div>
