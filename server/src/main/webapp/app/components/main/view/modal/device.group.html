<!-- Localization completed -->
<div class="modern-modal-header">
    <div class="modern-modal-icon">
        <span class="glyphicon glyphicon-th-large"></span>
    </div>
    <h4 class="modern-modal-title" localized>button.set.group</h4>
    <button type="button" class="modern-modal-close" ng-click="closeModal()" aria-label="Close">&times;</button>
</div>

<div ng-show='errorMessage' class='device-details-inline-error'><span>{{errorMessage}}</span></div>

<div class='modal-body modern-modal-body'>
    <div class="design-field">
        <label class="design-field-label" localized>form.update.device.action</label>
        <select class='form-control modern-select' ng-model='groupAction'>
            <option ng-value="'set'" selected localized>form.device.set.group</option>
            <option ng-value="'clear'" localized>form.device.clear.group</option>
        </select>
    </div>

    <div class="design-field">
        <label class="design-field-label" localized>form.device.groups</label>
        <div ng-dropdown-multiselect
             options='groupsList'
             translation-texts='tableFilteringTexts'
             selected-model='groupsSelection'
             class='left margin-right-half custom-multi-select'></div>
    </div>

    <div class="modern-modal-actions">
        <button type='button' class='btn btn-default' ng-click='closeModal()' ng-disabled="saving" localized>button.cancel</button>
        <button type='submit' class='btn btn-default btn-modern-primary' ng-click='save()' ng-disabled="saving">
            <span ng-if="!saving">{{ ('devices.bulk.apply.to' | localize).replace('${count}', selectedCount) }}</span>
            <span ng-if="saving" localized>devices.bulk.applying</span>
        </button>
    </div>
</div>
