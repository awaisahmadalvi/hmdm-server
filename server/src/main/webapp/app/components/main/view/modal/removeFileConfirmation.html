<!-- Localization completed -->
<div class="modern-modal-header">
    <div class="modern-modal-icon">
        <span class="glyphicon glyphicon-trash"></span>
    </div>
    <h4 class="modern-modal-title">{{file.description || file.filePath || file.url}}</h4>
    <button type="button" class="modern-modal-close" ng-click="closeModal()" aria-label="Close">&times;</button>
</div>

<div class='modal-body modern-modal-body'>
    <p localized>form.configuration.file.remove.prompt.1</p>

    <div class="design-field" ng-if="deleteOptionEnabled">
        <div class="settings-field-row">
            <label class="design-field-label" for="fhfdh93239" localized>form.configuration.file.remove.prompt.2</label>
            <span class="modern-toggle">
                <input ng-model='obj.deleteFileFromDisk' type='checkbox' class="modern-toggle-input" id="fhfdh93239"/>
                <span class="modern-toggle-track"><span class="modern-toggle-knob"></span></span>
            </span>
        </div>
    </div>

    <div class="modern-modal-actions text-center">
        <button type='button' class='btn btn-default' ng-click='closeModal()' localized>button.cancel</button>
        <button type='submit' class='btn btn-default btn-modern-primary' ng-click='save()' localized>button.delete</button>
    </div>
</div>
