<!-- Localization completed -->
<div class="modern-modal-header">
    <div class="modern-modal-icon">
        <span class="glyphicon glyphicon-duplicate"></span>
    </div>
    <h4 class="modern-modal-title" localized>modal.configuration.title.copy</h4>
    <button type="button" class="modern-modal-close" ng-click="closeModal()" aria-label="Close">&times;</button>
</div>

<div ng-show='errorMessage' class='modal-header'>
    <div ng-show='errorMessage' class='error'><span>{{errorMessage}}</span></div>
</div>
<div class='modal-body modern-modal-body'>
    <form class='form-horizontal'>

        <div class='form-group'>
            <label class='col-sm-3 control-label' localized>form.configuration.copy.new.name</label>
            <div class='col-sm-9'>
                <input ng-model='configuration.name' required type='text' class='form-control'
                       localized-placeholder='form.configuration.copy.new.name.placeholder'/>
            </div>
        </div>

        <div class='form-group'>
            <label class='col-sm-3 control-label' localized>form.configuration.settings.common.desc</label>
            <div class='col-sm-9'>
                <textarea ng-model='configuration.description' class='form-control no-resize'
                          localized-placeholder='form.configuration.settings.common.desc.placeholder'></textarea>
            </div>
        </div>

        <div class='form-group modern-modal-actions'>
            <div class='col-sm-offset-3 col-sm-8'>
                <button type='button' class='btn btn-default' ng-click='closeModal()' localized>button.cancel</button>
                <button type='submit' class='btn btn-default btn-modern-primary' ng-click='save()' localized>button.save</button>
            </div>
        </div>
    </form>
</div>
