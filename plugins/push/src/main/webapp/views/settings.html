<!-- Localization completed -->
<div class="width-800 modern-page push-settings-page" ng-controller="PluginPushSettingsController">

    <plugin-settings-header
            icon="glyphicon-send"
            name="{{'plugin.push.settings.title' | localize}}"
            subtitle="{{'plugin.push.settings.subtitle' | localize}}"
            breadcrumb-label="{{'breadcrumb.plugin.push.main' | localize}}"
            plugin-state="plugin-push">
    </plugin-settings-header>

    <plugin-purge-card
            title="{{'plugin.push.settings.danger.title' | localize}}"
            description="{{'plugin.push.settings.danger.description' | localize}}"
            item-label="{{'plugin.push.settings.item.label' | localize}}"
            days="settings.pushPurgePeriod"
            note="{{'plugin.push.settings.scheduled.tasks.note' | localize}}"
            purge-action="doPurge(days, onSuccess, onError)">
    </plugin-purge-card>

</div>
