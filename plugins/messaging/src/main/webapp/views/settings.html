<!-- Localization completed -->
<div class="width-800 modern-page messaging-settings-page" ng-controller="PluginMessagingSettingsController">

    <plugin-settings-header
            icon="glyphicon-comment"
            name="{{'plugin.messaging.settings.title' | localize}}"
            subtitle="{{'plugin.messaging.settings.subtitle' | localize}}"
            breadcrumb-label="{{'breadcrumb.plugin.messaging.main' | localize}}"
            plugin-state="plugin-messaging">
    </plugin-settings-header>

    <div ng-show='errorMessage' class='device-details-inline-error'><span>{{errorMessage}}</span></div>
    <div ng-show='successMessage' class='device-details-inline-success'><span>{{successMessage}}</span></div>

    <div class="device-details-card danger-zone-card">
        <div class="device-details-card-header danger-zone-card-header">
            <span class="glyphicon glyphicon-trash"></span>
            <span localized>plugin.messaging.settings.danger.title</span>
        </div>
        <p class="danger-zone-desc" localized>plugin.messaging.settings.danger.description</p>

        <div class="design-field">
            <label class="design-field-label" for="c0" localized>plugin.messaging.settings.message.purge.period</label>
            <div class="danger-zone-inline">
                <div class="number-suffix-input-wrap">
                    <input id="c0" ng-model='settings.messagingPurgePeriod' type='number' min="1" step="1"
                           class='form-control logs-input settings-input-narrow number-suffix-input'
                           ng-class="{'modern-input-invalid': purgePeriodInvalid()}"/>
                    <span class="number-suffix" localized>plugin.messaging.settings.purge.period.suffix</span>
                </div>
                <button type="button" class="btn btn-danger-outline" ng-disabled="purgePeriodInvalid()" ng-click="purge()" localized>plugin.messaging.settings.message.purge.button</button>
            </div>
            <div class="design-field-error" ng-if="purgePeriodInvalid()" localized>plugin.messaging.settings.purge.period.error</div>
        </div>
    </div>

    <div class="modern-toast" ng-if="settingsToast" ng-class="'modern-toast-' + settingsToast.type">
        {{settingsToast.message}}
    </div>
</div>
