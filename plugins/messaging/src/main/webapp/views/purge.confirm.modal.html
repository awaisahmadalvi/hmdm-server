<!-- Localization completed -->
<div class="modern-modal-header">
    <div class="modern-modal-icon modern-modal-icon-danger">
        <span class="glyphicon glyphicon-trash"></span>
    </div>
    <h4 class="modern-modal-title">{{confirmTitle}}</h4>
    <button type="button" class="modern-modal-close" ng-click="closeModal()" aria-label="Close">&times;</button>
</div>

<div ng-show='errorMessage' class='modal-header'>
    <div ng-show='errorMessage' class='error'><span>{{errorMessage}}</span></div>
</div>
<div class="modal-body modern-modal-body">
    <p class="danger-zone-desc">{{confirmBody}}</p>

    <div class="modern-modal-actions">
        <button type="button" class="btn btn-default" ng-click="closeModal()" localized>button.cancel</button>
        <button type="button" class="btn btn-danger-solid" ng-click="confirmPurge()" ng-disabled="purging">
            <span ng-if="!purging" localized>plugin.messaging.settings.confirm.purge.button</span>
            <span ng-if="purging" localized>plugin.messaging.settings.confirm.purging</span>
        </button>
    </div>
</div>
